services:
  # CloudPrep Golang + Gin Web Service (Render Free Tier)
  - type: web
    name: cloudprep-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: GIN_MODE
        value: release
      - key: PORT
        value: 8080
      - key: FRONTEND_ORIGIN
        value: http://localhost:3000,https://cloudprep.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_PRIMARY_PROVIDER
        value: gemini
      - key: AI_FALLBACK_PROVIDER
        value: groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_ID
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_ID
        value: openai/gpt-oss-120b

